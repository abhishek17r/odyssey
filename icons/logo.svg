<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="o-sea" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1c3570"/>
      <stop offset="1" stop-color="#0a1330"/>
    </linearGradient>
    <linearGradient id="o-bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8dc98"/>
      <stop offset="1" stop-color="#cf8f2e"/>
    </linearGradient>
    <linearGradient id="o-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#4f7cff"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#o-sea)"/>
  <!-- guiding star -->
  <path d="M97 16 L100.6 27.4 L112 31 L100.6 34.6 L97 46 L93.4 34.6 L82 31 L93.4 27.4 Z" fill="#f8dc98"/>
  <!-- sails -->
  <path d="M60 22 C 50 40, 40 62, 30 80 L 60 80 Z" fill="url(#o-bronze)"/>
  <path d="M66 32 C 80 46, 88 62, 92 80 L 66 80 Z" fill="#eef3ff"/>
  <!-- hull -->
  <path d="M24 86 H 100 L 90 98 H 36 Z" fill="url(#o-bronze)"/>
  <!-- wave -->
  <path d="M12 110 q 13 -9 26 0 t 26 0 t 26 0 t 26 0" fill="none" stroke="url(#o-wave)" stroke-width="7" stroke-linecap="round"/>
</svg>
