# Deploys the Edge Functions (odyssey-push, odyssey-athena) to Supabase whenever their code (or the shared lib/) changes.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'lib/**'
      - 'rewards.config.js'
      - '.github/workflows/push-function.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0 # pinned: "latest" needs a GitHub API lookup that gets rate-limited
      - name: Bring in the shared app logic
        run: |
          for f in odyssey-push odyssey-athena; do
            cp -R lib supabase/functions/$f/lib
            cp rewards.config.js supabase/functions/$f/
          done
      - name: Deploy
        run: |
          supabase functions deploy odyssey-push --remote=wotlxnvhhgtrgsaggvui --no-verify-jwt --yes
          supabase functions deploy odyssey-athena --remote=wotlxnvhhgtrgsaggvui --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
