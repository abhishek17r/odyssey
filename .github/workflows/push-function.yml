# Deploys the odyssey-push Edge Function to Supabase whenever its code (or the shared lib/) changes.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
name: Deploy push function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'lib/**'
      - 'rewards.config.js'
      - '.github/workflows/push-function.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Bring in the shared app logic
        run: |
          cp -R lib supabase/functions/odyssey-push/lib
          cp rewards.config.js supabase/functions/odyssey-push/
      - name: Deploy
        run: supabase functions deploy odyssey-push --project-ref wotlxnvhhgtrgsaggvui --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
